# GitHub Action: containarium-run
#
# Spins up a Containarium box per CI job, runs the project's
# .github/containarium.yml `setup:` + `test:` commands inside it, and
# tears it down. On failure, can keep the box alive for an hour and
# post a comment with SSH + agent-box MCP URLs so a human or an
# agent can debug the broken state in place.
#
# Status: v0 SCAFFOLD. The action surface (inputs/outputs/composition)
# is the contract we intend to ship. Several steps have `# TODO:`
# markers where the underlying containarium CLI or Cloud API surface
# still needs work — see STATUS.md.

name: 'Containarium Run'
description: 'Run CI in a Containarium box you can SSH into when it fails. Bring your own agent for debug-on-failure.'
author: 'FootprintAI'

branding:
  icon: 'box'
  color: 'blue'

inputs:
  server:
    description: 'Containarium server address (matches the CLI''s --server flag and CONTAINARIUM_SERVER env var). Defaults to Containarium Cloud; point at https://your-host:8080 for self-hosted.'
    required: false
    default: 'https://cloud.containarium.dev'
  token:
    description: 'API token (use a GitHub secret).'
    required: true
  config:
    description: 'Path to containarium.yml in your repo.'
    required: false
    default: '.github/containarium.yml'
  box-cpu:
    # Right-size the CI box. Concurrency per backend host is roughly
    # floor(host vCPU / box vCPU), so smaller boxes pack more parallel
    # jobs per host. A `resources:` block in containarium.yml overrides
    # these per-role (see docs/RUNNERS.md). Defaults preserve the prior
    # 4 / 4GB / 50GB behaviour.
    description: 'CPU cores for the box (e.g. "2"). Overridden by a resources.cpu in containarium.yml. Default 4.'
    required: false
    default: '4'
  box-memory:
    description: 'Memory for the box (e.g. "2GB"). Overridden by resources.memory in containarium.yml. Default 4GB.'
    required: false
    default: '4GB'
  box-disk:
    description: 'Disk for the box (e.g. "50GB"). Overridden by resources.disk in containarium.yml. Default 50GB.'
    required: false
    default: '50GB'
  cache-key:
    # Plain text only — GHA evaluates ${{ }} expressions in input
    # descriptions, and hashFiles() is a workflow-context function not
    # available at action-load time. Document the recommended caller
    # usage in prose instead of demonstrating it inline.
    description: 'Optional cache key to reuse a warm box volume across runs. Callers typically pass hashFiles of their lockfile (e.g. hashFiles for go.sum or package-lock.json) via the workflow expression. Not yet implemented — set but ignored.'
    required: false
    default: ''
  keep-on-failure:
    description: 'On failure, keep the box alive for 1h and post a PR comment with SSH + MCP debug URLs.'
    required: false
    default: 'true'
  org-id:
    # Optional for v0: when set, the runner reports debug-box metadata
    # back to the cloud's CI dashboard on test failure (powers the
    # FailureDebugSurface panel on /ci/runs/<id>). Skip when empty —
    # no cloud reporting attempted, preserves backwards-compat for
    # users who haven't run the onboarding wizard yet (the wizard
    # will eventually write this as a repo variable alongside
    # CONTAINARIUM_TOKEN; for now operators set it manually).
    description: 'Cloud org id (UUID). Optional; when set, debug-box info is reported back to the cloud dashboard on failure. Find it under /settings or by inspecting an existing /v1/orgs/{org}/... URL while signed in.'
    required: false
    default: ''
  ssh-host:
    # The box's SSH host is normally taken from the create response's
    # `sshHost` field — the cloud is the only party that knows it (the
    # region CODE "asia-east" isn't the DNS LABEL "asia-east1", so it
    # can't be derived client-side). This input is a FALLBACK for the
    # window before the control plane is configured with per-region
    # ssh_host: when the response carries no sshHost, the action uses
    # this value instead. Leave empty once the cloud returns sshHost.
    description: 'Override/fallback SSH host for the box (e.g. asia-east1.containarium.dev). Normally unset — the create response supplies it. Set only if your cloud has not yet been configured to return sshHost.'
    required: false
    default: ''
  preview-domain:
    # The PR-preview hostname the action passes to `containarium
    # expose-port --domain`. Required by the CLI; caller-supplied
    # so the hostname pattern is template-friendly (e.g.
    # `pr-${{ github.event.pull_request.number }}.previews.example.com`).
    # When empty AND the user's containarium.yml has a `serve:` block,
    # the expose step is skipped with a clear log line — same posture
    # as `org-id`. See https://github.com/FootprintAI/containarium-run/issues/13.
    description: 'Public hostname to route to the container when containarium.yml has a serve: block (e.g. pr-42.previews.example.com). Required when serve is defined; skipped otherwise.'
    required: false
    default: ''

outputs:
  box-id:
    description: 'The Containarium box ID created for this run.'
    value: ${{ steps.create.outputs.box-id }}
  preview-url:
    description: 'Public URL if containarium.yml defines a serve: block.'
    value: ${{ steps.expose.outputs.url }}
  debug-url:
    description: 'Agent-box MCP URL (only set on failure when keep-on-failure=true).'
    value: ${{ steps.debug.outputs.url }}

runs:
  using: 'composite'
  steps:
    # ------------------------------------------------------------------
    # 1. Install the containarium CLI on the GHA runner.
    # ------------------------------------------------------------------
    - name: Install containarium CLI
      shell: bash
      env:
        CONTAINARIUM_VERSION: ${{ env.CONTAINARIUM_CLI_VERSION || 'latest' }}
      run: |
        set -euo pipefail
        # install-cli.sh pulls just the CLI binary (no daemon, no Incus).
        # Requires hacks/install-cli.sh on the FootprintAI/containarium
        # main branch — see https://github.com/FootprintAI/Containarium/pull/295.
        curl -fsSL \
          https://raw.githubusercontent.com/footprintai/containarium/main/hacks/install-cli.sh \
          | sudo bash
        # The CLI exposes its version via a subcommand, not a top-level
        # --version flag (different from the `containarium` daemon, which
        # accepts both).
        containarium version

    # ------------------------------------------------------------------
    # 2. Parse the user's containarium.yml.
    # ------------------------------------------------------------------
    - name: Parse containarium.yml
      shell: bash
      id: config
      run: |
        set -euo pipefail
        CFG="${{ inputs.config }}"
        if [ ! -f "$CFG" ]; then
          echo "::error::config file not found: $CFG"
          exit 1
        fi
        # Parse via python3 + PyYAML — both are present on every Linux
        # runner GitHub Actions supports (ubuntu-latest preinstalls
        # PyYAML; self-hosted runners with a base ubuntu/debian image
        # have python3-yaml in apt). This avoids the yq prerequisite
        # that bit us on self-hosted boxes (Containarium-cloud CI:
        # `yq: command not found`, exit 127, before any box was
        # created — the failure-handling step's debug comment came
        # through but with an empty BOX, so useless).
        #
        # The yaml→json→shell-var bridge keeps the heredoc-into-
        # $GITHUB_OUTPUT shape (no quoting / escape headaches for
        # multi-line setup/test scripts).
        eval "$(python3 - "$CFG" <<'PY'
        import json, shlex, sys
        try:
            import yaml
        except ImportError:
            print('echo "::error::python3 yaml module missing; apt-get install python3-yaml on the runner"; exit 1')
            sys.exit(0)
        with open(sys.argv[1]) as f:
            d = yaml.safe_load(f) or {}
        def join_cmds(x):
            if not x: return ""
            if isinstance(x, str): return x
            if isinstance(x, list): return " && ".join(str(c) for c in x)
            return ""
        image      = d.get("image") or "ubuntu-24.04"
        setup      = join_cmds(d.get("setup"))
        test_cmd   = join_cmds(d.get("test"))
        serve      = d.get("serve") or {}
        serve_cmd  = serve.get("command", "") if isinstance(serve, dict) else ""
        serve_port = serve.get("port", "")    if isinstance(serve, dict) else ""
        # Optional per-role box sizing. Empty here → the create step falls
        # back to the box-cpu/box-memory/box-disk action inputs.
        res        = d.get("resources") or {}
        res_cpu    = res.get("cpu", "")    if isinstance(res, dict) else ""
        res_mem    = res.get("memory", "") if isinstance(res, dict) else ""
        res_disk   = res.get("disk", "")   if isinstance(res, dict) else ""
        for var, val in [
            ("IMAGE",      image),
            ("SETUP",      setup),
            ("TEST",       test_cmd),
            ("SERVE_CMD",  serve_cmd),
            ("SERVE_PORT", str(serve_port) if serve_port != "" else ""),
            ("RES_CPU",    str(res_cpu)  if res_cpu  != "" else ""),
            ("RES_MEM",    str(res_mem)  if res_mem  != "" else ""),
            ("RES_DISK",   str(res_disk) if res_disk != "" else ""),
        ]:
            print(f"{var}={shlex.quote(str(val))}")
        PY
        )"
        {
          echo "image=$IMAGE"
          echo "setup<<EOF"; echo "$SETUP"; echo "EOF"
          echo "test<<EOF";  echo "$TEST";  echo "EOF"
          echo "serve-cmd=$SERVE_CMD"
          echo "serve-port=$SERVE_PORT"
          echo "res-cpu=$RES_CPU"
          echo "res-memory=$RES_MEM"
          echo "res-disk=$RES_DISK"
        } >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 3a. Generate a throwaway SSH keypair for this CI run.
    #
    # `containarium create` REQUIRES --ssh-key (the CLI rejects calls
    # without one — "Error: required flag(s) "ssh-key" not set"). The
    # action can't carry a long-lived key, so we mint a fresh ed25519
    # pair per run, pass the pubkey at create time, and use the
    # privkey for the subsequent ssh / rsync / scp calls.
    #
    # Both files land under $RUNNER_TEMP (cleaned up by GHA at the
    # end of the job). The privkey is mode 0600 so ssh accepts it.
    # ------------------------------------------------------------------
    - name: Mint per-run SSH keypair
      shell: bash
      id: sshkey
      run: |
        set -euo pipefail
        KEY="${RUNNER_TEMP}/containarium-ci-key"
        ssh-keygen -t ed25519 -N "" -f "$KEY" -C "containarium-ci-${GITHUB_RUN_ID}" -q
        chmod 600 "$KEY"
        echo "priv=$KEY" >> "$GITHUB_OUTPUT"
        echo "pub=${KEY}.pub" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 3b. Create the box.
    # ------------------------------------------------------------------
    - name: Create Containarium box
      shell: bash
      id: create
      env:
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
        SSH_HOST_OVERRIDE:   ${{ inputs.ssh-host }}
      run: |
        set -euo pipefail
        # Box name must satisfy the daemon's jump-server username validator:
        # [a-zA-Z0-9_-], 1-32 chars, no leading digit/dash. Make it JOB-unique
        # (it was run-level — ci-<run>-<attempt> — so every job in a run shared
        # ONE name and collided, especially when a failed job didn't tear down).
        # 'b' prefix (no leading digit) + 12-char hash of (run, attempt, job) =
        # 13 chars, unique per job.
        SUFFIX=$(printf '%s-%s-%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" | sha1sum | cut -c1-12)
        BOX_NAME="b${SUFFIX}"

        # box_exists: does the daemon already have this box? 200=yes, 404=no.
        # Retries through the brief edge-TLS flap (FootprintAI/Containarium#400)
        # so a transient GET failure isn't misread as "absent".
        box_exists() {
          local code
          for _ in 1 2 3; do
            code=$(curl -s --http1.1 -m10 -o /dev/null -w '%{http_code}' \
              -H "authorization: Bearer ${CONTAINARIUM_TOKEN}" \
              "${CONTAINARIUM_SERVER%/}/v1/containers/${BOX_NAME}" 2>/dev/null || true)
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *)   sleep 2 ;;
            esac
          done
          return 1
        }

        # sshKeys must be the public key's CONTENTS, not the file path.
        # steps.sshkey.outputs.pub is the PATH to the .pub file, so read it
        # here. (Sending the path made the daemon reject the create with
        # "ssh_keys[0]: not a valid SSH public key: ssh: no key found".)
        PUBKEY=$(cat "${{ steps.sshkey.outputs.pub }}")
        if [ -z "$PUBKEY" ]; then
          echo "::error::public key file ${{ steps.sshkey.outputs.pub }} is empty/missing"
          exit 1
        fi

        # Resolve box size: a resources: block in containarium.yml wins
        # (per-role), else the box-cpu/box-memory/box-disk action inputs
        # (workflow-level default), else the prior 4 / 4GB / 50GB. Smaller
        # boxes pack more concurrent jobs per backend host — see
        # docs/RUNNERS.md.
        CPU="${{ steps.config.outputs.res-cpu }}";    [ -n "$CPU" ] || CPU="${{ inputs.box-cpu }}"
        MEM="${{ steps.config.outputs.res-memory }}"; [ -n "$MEM" ] || MEM="${{ inputs.box-memory }}"
        DISK="${{ steps.config.outputs.res-disk }}";  [ -n "$DISK" ] || DISK="${{ inputs.box-disk }}"
        echo "box size: cpu=$CPU memory=$MEM disk=$DISK"

        # Build the create request body. Matches the daemon's REST schema
        # (camelCase).
        body=$(jq -nc \
          --arg u    "$BOX_NAME" \
          --arg img  "${{ steps.config.outputs.image }}" \
          --arg key  "$PUBKEY" \
          --arg cpu  "$CPU" \
          --arg mem  "$MEM" \
          --arg disk "$DISK" \
          '{username:$u, image:$img, sshKeys:[$key],
            resources:{cpu:$cpu, memory:$mem, disk:$disk}}')

        # Idempotent create via the REST API over curl (HTTP/1.1).
        #
        # Why curl and not `containarium create`: the Go CLI's REST client
        # auto-negotiates HTTP/2, and a long-running create carried on an
        # HTTP/2 connection through the fronting TLS edge intermittently
        # resets the response with `tls: internal error` even though the box
        # was provisioned (FootprintAI/Containarium#422 — confirmed h2-only;
        # HTTP/1.1 is clean). curl defaults to HTTP/1.1, so it sidesteps the
        # flap entirely. We still guard idempotency: on any non-2xx, check
        # whether the box exists before retrying (the daemon may have created
        # it and only the response dropped), and fail fast on a permanent 4xx.
        # Preflight: a missing server is the single most common
        # misconfiguration and otherwise surfaces as an opaque HTTP 000.
        # (The value is masked in logs if it's a secret; we only assert
        # it's non-empty.) Fail fast with an actionable message.
        if [ -z "${CONTAINARIUM_SERVER:-}" ]; then
          echo "::error::CONTAINARIUM_SERVER is empty — set the repo/org secret to your edge, e.g. https://cloud.containarium.dev"
          exit 1
        fi

        attempts=5
        delay=2
        created=0
        for i in $(seq 1 "$attempts"); do
          # Capture curl's transport exit code separately from the HTTP
          # status so a connection-level failure (HTTP 000) is debuggable
          # instead of opaque: curl exit 6=DNS/unknown host, 7=connection
          # refused, 28=timeout, 35=TLS handshake. `set +e` so a non-zero
          # curl doesn't trip `set -e` before we read $?.
          set +e
          http_code=$(curl -sS --http1.1 -m 900 -o /tmp/cnt-create.out -w '%{http_code}' \
            -X POST "${CONTAINARIUM_SERVER%/}/v1/containers" \
            -H "authorization: Bearer ${CONTAINARIUM_TOKEN}" \
            -H 'content-type: application/json' \
            -d "$body" 2>/tmp/cnt-create.err)
          curl_rc=$?
          set -e
          out=$(cat /tmp/cnt-create.out 2>/dev/null || true)
          echo "create '${BOX_NAME}' -> HTTP ${http_code} (curl exit ${curl_rc})"
          [ -n "$out" ] && echo "$out"
          if [ "$curl_rc" -ne 0 ]; then
            # No HTTP response (HTTP 000). The server URL is a masked secret
            # in logs, but curl's exit code + message (e.g. "Could not
            # resolve host", "Connection refused") localizes the cause —
            # almost always a wrong/empty CONTAINARIUM_SERVER, DNS, or TLS.
            echo "::warning::curl transport error (exit ${curl_rc}): $(tr -d '\r' < /tmp/cnt-create.err | tail -1)"
          fi
          case "$http_code" in
            200|201)
              created=1
              break
              ;;
            400|401|403|404|422)
              echo "::error::create failed (HTTP ${http_code}, permanent) — not retrying"
              exit 1
              ;;
          esac
          # 5xx / 000 (timeout or dropped response) / 409: the daemon may
          # have created the box anyway — check before retrying.
          if box_exists; then
            echo "create response was HTTP ${http_code} but box '${BOX_NAME}' exists — treating as created"
            created=1
            break
          fi
          if [ "$i" -lt "$attempts" ]; then
            echo "::warning::create attempt $i/$attempts failed (HTTP ${http_code}) and box absent — retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 ))
            continue
          fi
        done
        if [ "$created" -ne 1 ]; then
          echo "::error::box '${BOX_NAME}' could not be created after $attempts attempts"
          exit 1
        fi

        # ---- Resolve the box's SSH identity from the create response ----
        #
        # The request `username` we sent ('${BOX_NAME}') is only the box's
        # human NAME. The cloud assigns its own OSS-side username
        # (cld-<short-id>) and returns it as `.container.username`; that is
        # BOTH the SSH user (sshpiper routes by it) and the key the cloud
        # addresses the box by on GET/DELETE — NOT the name we sent. The
        # SSH host is `.container.sshHost` (the regional sentinel; the
        # client cannot derive it — the region code isn't the DNS label).
        # Every later step dials ${SSH_USER}@${SSH_HOST}, so resolve both
        # here and fail loudly if either is missing rather than SSHing to a
        # bare box name (which is exactly the "Could not resolve hostname"
        # break this replaces).
        SSH_USER=$(jq -r '.container.username // empty' /tmp/cnt-create.out 2>/dev/null || true)
        SSH_HOST=$(jq -r '.container.sshHost  // empty' /tmp/cnt-create.out 2>/dev/null || true)
        if [ -z "$SSH_HOST" ]; then
          # Cloud hasn't been configured to return sshHost yet — fall back
          # to the action input if the caller provided one.
          SSH_HOST="${SSH_HOST_OVERRIDE:-}"
        fi
        if [ -z "$SSH_USER" ]; then
          echo "::error::create succeeded but the response carried no container.username — cannot resolve the SSH user (the cloud keys boxes by cld-<id>). Response was:"
          cat /tmp/cnt-create.out 2>/dev/null || true
          exit 1
        fi
        if [ -z "$SSH_HOST" ]; then
          echo "::error::no SSH host for the box: the create response had no .container.sshHost and no ssh-host input was set. Configure per-region ssh_host on the cloud (OSS_PRIMARY_SENTINELS), or pass the ssh-host input as a stopgap."
          exit 1
        fi
        echo "box created: name='${BOX_NAME}' ssh-user='${SSH_USER}' ssh-host='${SSH_HOST}'"
        {
          echo "box-id=$BOX_NAME"
          echo "ssh-user=$SSH_USER"
          echo "ssh-host=$SSH_HOST"
        } >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 3c. Wait for the box to be RUNNING and SSH-reachable.
    #
    # Create is ASYNC: the cloud parks the request and a regional daemon
    # provisions the box (image pull dominates — tens of seconds on a cold
    # host). The box's username + host are known the moment create returns,
    # but ssh won't connect until it's RUNNING and sshd is up. Poll the
    # cloud for state, then probe ssh, so push/test don't race a
    # half-provisioned box (that race is why a freshly-created box's first
    # ssh used to fail intermittently).
    # ------------------------------------------------------------------
    - name: Wait for box ready
      shell: bash
      env:
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
      run: |
        set -euo pipefail
        SSH_USER="${{ steps.create.outputs.ssh-user }}"
        SSH_HOST="${{ steps.create.outputs.ssh-host }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"

        # 1) Wait until the cloud reports the box RUNNING. GET is keyed by
        #    the cloud username (cld-<id>) — the same identity we ssh as,
        #    NOT the request name.
        state_deadline=$(( $(date +%s) + 300 ))
        state=""
        while [ "$(date +%s)" -lt "$state_deadline" ]; do
          body=$(curl -s --http1.1 -m 10 \
            -H "authorization: Bearer ${CONTAINARIUM_TOKEN}" \
            "${CONTAINARIUM_SERVER%/}/v1/containers/${SSH_USER}" 2>/dev/null || true)
          state=$(printf '%s' "$body" | jq -r '.container.state // empty' 2>/dev/null || true)
          case "$state" in
            CONTAINER_STATE_RUNNING) echo "box ${SSH_USER} is RUNNING"; break ;;
            CONTAINER_STATE_FAILED)  echo "::error::box ${SSH_USER} entered FAILED state"; exit 1 ;;
            *) echo "waiting for RUNNING (state=${state:-unknown})"; sleep 5 ;;
          esac
        done
        if [ "$state" != "CONTAINER_STATE_RUNNING" ]; then
          echo "::error::box ${SSH_USER} did not reach RUNNING within 300s (last state=${state:-unknown})"
          exit 1
        fi

        # 2) Wait until sshd answers. A no-op ssh is the honest readiness
        #    probe — RUNNING means the box exists; sshpiper + the box's sshd
        #    may need a few more seconds.
        ssh_deadline=$(( $(date +%s) + 120 ))
        until ssh -i "$SSH_KEY" \
                  -o StrictHostKeyChecking=accept-new \
                  -o IdentitiesOnly=yes \
                  -o BatchMode=yes \
                  -o ConnectTimeout=10 \
                  "${SSH_USER}@${SSH_HOST}" true 2>/dev/null; do
          if [ "$(date +%s)" -ge "$ssh_deadline" ]; then
            echo "::error::box ${SSH_USER}@${SSH_HOST} did not accept SSH within 120s"
            exit 1
          fi
          echo "waiting for sshd at ${SSH_USER}@${SSH_HOST}..."
          sleep 5
        done
        echo "ssh to ${SSH_USER}@${SSH_HOST} is up"

    # ------------------------------------------------------------------
    # 4. Push source code into the box.
    #
    # Uses the per-run privkey from step 3a directly, bypassing
    # `containarium ssh-config sync` (which is meant for ad-hoc
    # persistent users + a long-lived ~/.ssh/id_ed25519 — not a CI
    # one-shot). StrictHostKeyChecking=accept-new pins the host's
    # key on first connect; subsequent steps in the same job reuse
    # the same known_hosts entry. We ssh as ${SSH_USER}@${SSH_HOST} —
    # the cloud-assigned username (sshpiper routes by it) at the
    # regional sentinel — NOT the bare box name.
    # ------------------------------------------------------------------
    - name: Push source to box
      shell: bash
      run: |
        set -euo pipefail
        SSH_USER="${{ steps.create.outputs.ssh-user }}"
        SSH_HOST="${{ steps.create.outputs.ssh-host }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"
        SSHOPTS="-i $SSH_KEY -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes"
        T="${SSH_USER}@${SSH_HOST}"
        # Confirm the REAL ssh session can write the workdir (diagnostic;
        # cheap, and pinpoints any session/permission surprise).
        ssh $SSHOPTS "$T" 'echo "DIAG home=$HOME pwd=$(pwd) user=$(whoami)"; mkdir -p ~/work && echo DIAG-mkdir-ok || echo DIAG-mkdir-FAIL; (touch ~/work/.probe && echo DIAG-write-ok) || echo DIAG-write-FAIL'
        # Push the working tree via tar-over-ssh into ~/work.
        #
        # NOTE: we hand-roll this rather than `containarium sync` because
        # sync's first step — read a remote manifest (find + sha256sum at the
        # remote path) — fails in THIS box's ssh session with an opaque
        # "read remote manifest: ssh manifest: exit status 1". The same script
        # runs fine via `su - <cld-user>` on the box, so it's specific to the
        # real sentinel → sshpiper → box session; there's no sync flag to skip
        # the manifest read. Filed upstream. tar only needs mkdir + extract, so
        # it sidesteps it. ~ expands to the cld-<id> login user's writable home,
        # and combining mkdir + extract in one remote command makes it
        # cwd-independent.
        tar -czf - . | ssh $SSHOPTS "$T" "mkdir -p ~/work && tar -xzf - -C ~/work"

    # ------------------------------------------------------------------
    # 5. Write CI context file into the box.
    #
    # Drops ~/work/.containarium/ci-context.json so the agent-box
    # MCP server can expose it as a resource. Without this, an agent
    # connecting to a failing box has zero context and wastes its first
    # turn asking "what am I looking at?" — see the companion change to
    # agent-box that surfaces this file as an MCP resource.
    #
    # On the create-time write we know everything except failing_test /
    # failure_log_tail; those fields are appended/overwritten by the
    # failure-handling step below if the test step fails.
    # ------------------------------------------------------------------
    - name: Write CI context to box
      shell: bash
      run: |
        set -euo pipefail
        SSH_USER="${{ steps.create.outputs.ssh-user }}"
        SSH_HOST="${{ steps.create.outputs.ssh-host }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"

        # Pull PR-specific fields out of the event payload when this is a
        # pull_request event; on push events they stay null and jq omits
        # them via the `// empty` fallbacks below.
        PR_NUMBER=""
        PR_URL=""
        PR_TITLE=""
        BRANCH=""
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -f "${GITHUB_EVENT_PATH:-}" ]; then
          PR_NUMBER=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
          PR_URL=$(jq -r '.pull_request.html_url // empty' "$GITHUB_EVENT_PATH")
          PR_TITLE=$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH")
          BRANCH=$(jq -r '.pull_request.head.ref // empty' "$GITHUB_EVENT_PATH")
        else
          # push event: branch comes from GITHUB_REF_NAME, PR fields stay empty.
          BRANCH="${GITHUB_REF_NAME:-}"
        fi

        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        # Build JSON with jq so user-controlled values (PR title, branch
        # name, actor) can never break out of string context. Numeric
        # fields use --argjson with a `// null` fallback for the push-event
        # case where pr_number is empty.
        jq -n \
          --arg   repo         "$GITHUB_REPOSITORY" \
          --arg   pr_url       "$PR_URL" \
          --arg   pr_title     "$PR_TITLE" \
          --arg   commit_sha   "$GITHUB_SHA" \
          --arg   branch       "$BRANCH" \
          --arg   actor        "$GITHUB_ACTOR" \
          --arg   run_id       "$GITHUB_RUN_ID" \
          --arg   run_url      "$RUN_URL" \
          --argjson pr_number  "${PR_NUMBER:-null}" \
          --argjson run_attempt "${GITHUB_RUN_ATTEMPT:-1}" \
          '{
            schema_version: "1.0",
            platform: "github",
            repo: $repo,
            pr_number: $pr_number,
            pr_url: (if $pr_url == "" then null else $pr_url end),
            pr_title: (if $pr_title == "" then null else $pr_title end),
            commit_sha: $commit_sha,
            branch: (if $branch == "" then null else $branch end),
            actor: $actor,
            run_id: $run_id,
            run_url: $run_url,
            run_attempt: $run_attempt,
            workspace_path: "~/work"
          }' \
          > /tmp/ci-context.json

        ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" -- "mkdir -p ~/work/.containarium"
        scp -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes /tmp/ci-context.json "${SSH_USER}@${SSH_HOST}:~/work/.containarium/ci-context.json"

    # ------------------------------------------------------------------
    # 6. Run setup commands inside the box (the "warm cache" half).
    # ------------------------------------------------------------------
    - name: Run setup
      shell: bash
      if: steps.config.outputs.setup != ''
      run: |
        set -euo pipefail
        SSH_USER="${{ steps.create.outputs.ssh-user }}"
        SSH_HOST="${{ steps.create.outputs.ssh-host }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"
        ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" -- \
          "cd ~/work && ${{ steps.config.outputs.setup }}"

    # ------------------------------------------------------------------
    # 7. Run the actual tests.
    #
    # Tee output to /tmp/test-output.log so the failure-handling step
    # can pull `failing_test` and `failure_log_tail` out of it for the
    # CI context file.
    # ------------------------------------------------------------------
    - name: Run test
      shell: bash
      id: test
      run: |
        set -euo pipefail
        SSH_USER="${{ steps.create.outputs.ssh-user }}"
        SSH_HOST="${{ steps.create.outputs.ssh-host }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"
        # Pipe through tee but preserve the exit status of ssh via
        # PIPESTATUS so a test failure still fails this step.
        set -o pipefail
        ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" -- \
          "cd ~/work && ${{ steps.config.outputs.test }}" \
          2>&1 | tee /tmp/test-output.log
        exit "${PIPESTATUS[0]}"

    # ------------------------------------------------------------------
    # 8. If containarium.yml had a `serve:` block, expose it.
    #    (Used for PR-preview environments — irrelevant for plain CI.)
    # ------------------------------------------------------------------
    - name: 'Expose port (if serve block defined)'
      shell: bash
      id: expose
      if: steps.config.outputs.serve-port != ''
      env:
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
        PREVIEW_DOMAIN: ${{ inputs.preview-domain }}
        SERVE_PORT: ${{ steps.config.outputs.serve-port }}
      run: |
        set -euo pipefail
        SSH_USER="${{ steps.create.outputs.ssh-user }}"
        SSH_HOST="${{ steps.create.outputs.ssh-host }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"
        # Start the serve command in the background inside the box.
        ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" -- \
          "cd ~/work && nohup ${{ steps.config.outputs.serve-cmd }} >/tmp/serve.log 2>&1 &"

        # Skip the actual expose if the caller didn't provide a
        # preview-domain — same posture as the org-id gate on the
        # debug-box reporter. The serve command still runs inside the
        # box (above) so the operator can SSH in to test, but the
        # public hostname requires explicit caller intent.
        # See https://github.com/FootprintAI/containarium-run/issues/13.
        if [ -z "${PREVIEW_DOMAIN:-}" ]; then
          echo "skipping expose-port: preview-domain input is empty."
          echo "  Pass `preview-domain: pr-\${{ github.event.pull_request.number }}.previews.example.com` (or similar)"
          echo "  on the containarium-run step to enable PR-preview hostnames."
          echo "url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # CLI flag surface (per internal/cmd/expose_port.go in
        # FootprintAI/Containarium):
        #   containarium expose-port <username> --container-port N --domain HOST
        # The <username> is the cloud-assigned OSS username (cld-<id>) —
        # the same identity the cloud keys the box by — NOT the request
        # name. No `--output url` flag exists; the URL the caller composes
        # from preview-domain is the URL (the CLI just wires the
        # proxy route to it).
        containarium expose-port "$SSH_USER" \
          --container-port "$SERVE_PORT" \
          --domain "$PREVIEW_DOMAIN"

        echo "url=https://$PREVIEW_DOMAIN" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 9. SUCCESS PATH — tear down the box.
    # ------------------------------------------------------------------
    - name: Tear down box (success)
      shell: bash
      if: success()
      env:
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
      run: |
        set -euo pipefail
        # Delete via the REST API over curl (HTTP/1.1) — same reason as
        # create (FootprintAI/Containarium#422: the CLI's HTTP/2 client
        # flaps through the edge). Teardown failures must not fail an
        # otherwise-green build, so a non-2xx is a warning, not an error;
        # 404 means it's already gone. DELETE is keyed by the cloud
        # username (cld-<id>), the identity the cloud addresses the box by
        # — NOT the request name (which the cloud only stored as the box's
        # human handle).
        SSH_USER="${{ steps.create.outputs.ssh-user }}"
        code=$(curl -sS --http1.1 -m 60 -o /dev/null -w '%{http_code}' \
          -X DELETE "${CONTAINARIUM_SERVER%/}/v1/containers/${SSH_USER}" \
          -H "authorization: Bearer ${CONTAINARIUM_TOKEN}" 2>/dev/null || echo 000)
        case "$code" in
          200|202|204|404) echo "box '${SSH_USER}' torn down (HTTP ${code})" ;;
          *) echo "::warning::teardown DELETE returned HTTP ${code} for '${SSH_USER}' — box may be leaked" ;;
        esac

    # ------------------------------------------------------------------
    # 10. FAILURE PATH — keep box alive, refresh CI context with
    #     failing-test info, post debug PR comment.
    # ------------------------------------------------------------------
    - name: Keep box alive + post debug comment on failure
      shell: bash
      id: debug
      if: failure() && inputs.keep-on-failure == 'true' && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
      run: |
        set -euo pipefail
        SSH_USER="${{ steps.create.outputs.ssh-user }}"
        SSH_HOST="${{ steps.create.outputs.ssh-host }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"

        # Refresh ~/work/.containarium/ci-context.json with what we
        # learned from the test run — failing_test name + tail of output.
        # Best-effort: if there's no test-output.log (e.g. setup itself
        # failed) we skip the refresh and the create-time context is what
        # the agent gets.
        if [ -f /tmp/test-output.log ]; then
          # Grab the last "FAIL:" / "--- FAIL:" / "FAIL " line and pull out
          # what looks like a test name. Covers `go test` (--- FAIL: TestX),
          # pytest (FAILED path::TestX), and generic "FAIL: name" output.
          # If nothing matches we leave failing_test null rather than
          # guessing — the agent can read failure_log_tail and figure it out.
          FAILING_TEST=$(grep -E '(^|[[:space:]])(---[[:space:]]+)?FAIL(ED)?[:[:space:]]' /tmp/test-output.log \
            | tail -n 1 \
            | sed -E 's/.*FAIL(ED)?:?[[:space:]]+([^[:space:]]+).*/\2/' \
            || true)
          FAILURE_LOG_TAIL=$(tail -n 50 /tmp/test-output.log)

          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" -- \
            "cat ~/work/.containarium/ci-context.json" > /tmp/ci-context.json.old || \
            echo '{}' > /tmp/ci-context.json.old

          jq \
            --arg failing_test     "$FAILING_TEST" \
            --arg failure_log_tail "$FAILURE_LOG_TAIL" \
            '. + {
              failing_test:     (if $failing_test     == "" then null else $failing_test     end),
              failure_log_tail: (if $failure_log_tail == "" then null else $failure_log_tail end)
            }' \
            /tmp/ci-context.json.old > /tmp/ci-context.json

          scp -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes /tmp/ci-context.json "${SSH_USER}@${SSH_HOST}:~/work/.containarium/ci-context.json" || true
        fi

        # Schedule auto-delete in 1h so the kept-alive debug box self-reaps
        # instead of leaking until someone deletes it by hand. The cloud
        # serves the OSS contract's SetContainerTTL RPC at
        # POST /v1/containers/<name>/ttl (FootprintAI/Containarium, server
        # handler in internal/server/container_server_ttl.go) — body is
        # {"durationSeconds": N}, the box is keyed by the cloud username
        # (cld-<id>), and the daemon's ttlsweeper force-deletes once the
        # wall clock passes now()+N. 3600s matches the "expires in 60
        # minutes" the debug comment below promises.
        #
        # Best-effort, same as teardown: a failed TTL stamp must not turn an
        # already-red build into a different red. A server that predates the
        # handler returns 501 (Unimplemented) — we warn and the box falls
        # back to manual cleanup rather than failing the step. curl over
        # HTTP/1.1 for the same #422 reason as create/delete.
        code=$(curl -sS --http1.1 -m 60 -o /dev/null -w '%{http_code}' \
          -X POST "${CONTAINARIUM_SERVER%/}/v1/containers/${SSH_USER}/ttl" \
          -H "authorization: Bearer ${CONTAINARIUM_TOKEN}" \
          -H 'content-type: application/json' \
          -d '{"durationSeconds": 3600}' 2>/dev/null || echo 000)
        case "$code" in
          200|201|204) echo "box '${SSH_USER}' will auto-delete in 1h (TTL set, HTTP ${code})" ;;
          *) echo "::warning::could not set 1h auto-delete TTL on '${SSH_USER}' (HTTP ${code}) — box may leak until manually deleted" ;;
        esac

        # Connection info is the REAL identity resolved at create: the
        # cloud-assigned user (cld-<id>) at the regional sentinel, port 22
        # (sshpiper routes by username) — not a hardcoded debug@…:2222.
        # NOTE: SSH in needs a key the box trusts. CI minted a throwaway
        # keypair that GHA discards at job end, so a human debugger must be
        # a registered collaborator with their own key on the box (box-
        # collaborators-governance) — key distribution is a separate change.
        SSH_CMD="ssh ${SSH_USER}@${SSH_HOST}"
        MCP_URL="ssh ${SSH_USER}@${SSH_HOST} agent-box"
        echo "url=$MCP_URL" >> "$GITHUB_OUTPUT"
        # TODO: sticky-comment behavior — find existing containarium-bot
        # comment on this PR and edit it instead of posting a new one.
        #
        # Post via gh CLI when available, else fall back to GitHub's
        # REST API directly. Many self-hosted runners don't ship gh —
        # falling back to curl keeps debug-on-failure visibility working
        # on any runner with bash + curl + jq. (jq is already a hard
        # dep — earlier steps use it to build ci-context.json.)
        BODY=$(cat <<EOF
        ### ❌ CI failed — box kept alive for debugging

        **Debug this box live** (expires in 60 minutes)

        \`\`\`bash
        # SSH in
        ${SSH_CMD}

        # Or hand it to your agent (Claude Code, Cursor, ...)
        # The box's agent-box MCP server is reachable over SSH-stdio:
        ${MCP_URL}
        \`\`\`

        Posted by [containarium-run](https://github.com/FootprintAI/containarium-run) · commit \`${GITHUB_SHA:0:7}\`
        EOF
        )
        PR_NUM="${{ github.event.pull_request.number }}"
        if command -v gh >/dev/null 2>&1; then
          gh pr comment "$PR_NUM" --body "$BODY"
        else
          # GH_TOKEN env above carries github.token; same auth as gh.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" \
            -d "$(jq -nc --arg body "$BODY" '{body: $body}')" \
            >/dev/null
        fi

        # Expose the SSH connection bits the next step (report-runtime)
        # needs. The PR comment above bakes them into a markdown
        # one-liner; the cloud's CI dashboard wants the structured
        # fields so it can render its own panel without parsing
        # markdown back out. Both flow from the same source so they
        # stay in sync.
        echo "ssh-host=${SSH_HOST}"  >> "$GITHUB_OUTPUT"
        echo "ssh-port=22"           >> "$GITHUB_OUTPUT"
        echo "ssh-user=${SSH_USER}"  >> "$GITHUB_OUTPUT"
        echo "mcp-url=$MCP_URL"      >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 11. FAILURE PATH (continued) — report the kept-alive box back to
    #     the cloud dashboard so the FailureDebugSurface panel renders
    #     real connection info rather than the "Coming soon" stub.
    #
    # Skipped (with a notice in the log, not a failure) when:
    #   - org-id is empty (operator hasn't wired it up)
    #   - the PR-comment step itself was skipped (no debug box to report)
    #
    # Best-effort: a 404 from the cloud (e.g. webhook hasn't yet
    # inserted the ci_jobs row) does NOT fail the workflow. The cloud
    # only knows about runs it has webhook-ingested; if we're racing
    # the webhook we accept that the dashboard panel may take a
    # follow-up wizard refresh to show the box. Logs the response
    # body either way so debugging is straightforward from the
    # Actions log.
    # ------------------------------------------------------------------
    - name: Report debug box to cloud dashboard
      shell: bash
      if: failure() && inputs.keep-on-failure == 'true' && github.event_name == 'pull_request' && inputs.org-id != ''
      env:
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
        ORG_ID:    ${{ inputs.org-id }}
        SSH_HOST:  ${{ steps.debug.outputs.ssh-host }}
        SSH_PORT:  ${{ steps.debug.outputs.ssh-port }}
        SSH_USER:  ${{ steps.debug.outputs.ssh-user }}
        MCP_URL:   ${{ steps.debug.outputs.mcp-url }}
      run: |
        set -euo pipefail
        # Skip silently when the debug step didn't run (e.g. failure
        # before box was up). steps.debug.outputs.ssh-host is empty
        # in that case.
        if [ -z "${SSH_HOST:-}" ]; then
          echo "no debug box to report (debug step didn't run); skipping"
          exit 0
        fi
        # Keep-alive window matches the PR-comment claim ("expires in
        # 60 minutes"). Compute as an RFC-3339 timestamp the cloud's
        # google.protobuf.Timestamp parser accepts directly.
        KEEP_UNTIL=$(date -u -d '+60 minutes' '+%Y-%m-%dT%H:%M:%SZ')

        # POST shape mirrors ReportCIJobRuntimeRequest in
        # proto/containarium/cloud/v1/ci_service.proto. container_id
        # is omitted ('' on the wire) — the OSS CLI doesn't yet
        # surface the cloud's container UUID; that wiring lands in a
        # follow-up. Debug box is what powers the C4 panel today.
        BODY=$(jq -nc \
          --arg org    "$ORG_ID" \
          --arg run    "$GITHUB_RUN_ID" \
          --arg job    "$GITHUB_JOB" \
          --arg host   "$SSH_HOST" \
          --argjson port "$SSH_PORT" \
          --arg user   "$SSH_USER" \
          --arg mcp    "$MCP_URL" \
          --arg until_ "$KEEP_UNTIL" \
          '{
            org_id:        $org,
            github_run_id: ($run | tonumber),
            job_name:      $job,
            container_id:  "",
            debug_box: {
              ssh_host:         $host,
              ssh_port:         $port,
              ssh_user:         $user,
              mcp_url:          $mcp,
              keep_alive_until: $until_
            }
          }')

        URL="${CONTAINARIUM_SERVER%/}/v1/orgs/${ORG_ID}/ci/runs/${GITHUB_RUN_ID}/jobs/${GITHUB_JOB}:report-runtime"
        # --max-time guards against the runner hanging if the cloud
        # is slow / down — failure-path step shouldn't block job
        # completion for more than a few seconds.
        HTTP_CODE=$(curl -sS -o /tmp/report-runtime.out -w '%{http_code}' \
          --max-time 10 \
          -X POST "$URL" \
          -H "Authorization: Bearer ${CONTAINARIUM_TOKEN}" \
          -H 'Content-Type: application/json' \
          -d "$BODY" \
          || echo "curl-failed")
        echo "report-runtime: $HTTP_CODE"
        cat /tmp/report-runtime.out || true
        # Don't fail the step on any cloud-side response — the user
        # already has the SSH/MCP info in the PR comment; the
        # dashboard panel is nice-to-have, not load-bearing.
