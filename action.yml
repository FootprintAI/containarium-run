# GitHub Action: containarium-run
#
# Spins up a Containarium box per CI job, runs the project's
# .github/containarium.yml `setup:` + `test:` commands inside it, and
# tears it down. On failure, can keep the box alive for an hour and
# post a comment with SSH + agent-box MCP URLs so a human or an
# agent can debug the broken state in place.
#
# Status: v0 SCAFFOLD. The action surface (inputs/outputs/composition)
# is the contract we intend to ship. Several steps have `# TODO:`
# markers where the underlying containarium CLI or Cloud API surface
# still needs work — see STATUS.md.

name: 'Containarium Run'
description: 'Run CI in a Containarium box you can SSH into when it fails. Bring your own agent for debug-on-failure.'
author: 'FootprintAI'

branding:
  icon: 'box'
  color: 'blue'

inputs:
  server:
    description: 'Containarium server address (matches the CLI''s --server flag and CONTAINARIUM_SERVER env var). Defaults to Containarium Cloud; point at https://your-host:8080 for self-hosted.'
    required: false
    default: 'https://cloud.containarium.dev'
  token:
    description: 'API token (use a GitHub secret).'
    required: true
  config:
    description: 'Path to containarium.yml in your repo.'
    required: false
    default: '.github/containarium.yml'
  cache-key:
    # Plain text only — GHA evaluates ${{ }} expressions in input
    # descriptions, and hashFiles() is a workflow-context function not
    # available at action-load time. Document the recommended caller
    # usage in prose instead of demonstrating it inline.
    description: 'Optional cache key to reuse a warm box volume across runs. Callers typically pass hashFiles of their lockfile (e.g. hashFiles for go.sum or package-lock.json) via the workflow expression. Not yet implemented — set but ignored.'
    required: false
    default: ''
  keep-on-failure:
    description: 'On failure, keep the box alive for 1h and post a PR comment with SSH + MCP debug URLs.'
    required: false
    default: 'true'

outputs:
  box-id:
    description: 'The Containarium box ID created for this run.'
    value: ${{ steps.create.outputs.box-id }}
  preview-url:
    description: 'Public URL if containarium.yml defines a serve: block.'
    value: ${{ steps.expose.outputs.url }}
  debug-url:
    description: 'Agent-box MCP URL (only set on failure when keep-on-failure=true).'
    value: ${{ steps.debug.outputs.url }}

runs:
  using: 'composite'
  steps:
    # ------------------------------------------------------------------
    # 1. Install the containarium CLI on the GHA runner.
    # ------------------------------------------------------------------
    - name: Install containarium CLI
      shell: bash
      env:
        CONTAINARIUM_VERSION: ${{ env.CONTAINARIUM_CLI_VERSION || 'latest' }}
      run: |
        set -euo pipefail
        # install-cli.sh pulls just the CLI binary (no daemon, no Incus).
        # Requires hacks/install-cli.sh on the FootprintAI/containarium
        # main branch — see https://github.com/FootprintAI/Containarium/pull/295.
        curl -fsSL \
          https://raw.githubusercontent.com/footprintai/containarium/main/hacks/install-cli.sh \
          | sudo bash
        # The CLI exposes its version via a subcommand, not a top-level
        # --version flag (different from the `containarium` daemon, which
        # accepts both).
        containarium version

    # ------------------------------------------------------------------
    # 2. Parse the user's containarium.yml.
    # ------------------------------------------------------------------
    - name: Parse containarium.yml
      shell: bash
      id: config
      run: |
        set -euo pipefail
        CFG="${{ inputs.config }}"
        if [ ! -f "$CFG" ]; then
          echo "::error::config file not found: $CFG"
          exit 1
        fi
        # Parse via python3 + PyYAML — both are present on every Linux
        # runner GitHub Actions supports (ubuntu-latest preinstalls
        # PyYAML; self-hosted runners with a base ubuntu/debian image
        # have python3-yaml in apt). This avoids the yq prerequisite
        # that bit us on self-hosted boxes (Containarium-cloud CI:
        # `yq: command not found`, exit 127, before any box was
        # created — the failure-handling step's debug comment came
        # through but with an empty BOX, so useless).
        #
        # The yaml→json→shell-var bridge keeps the heredoc-into-
        # $GITHUB_OUTPUT shape (no quoting / escape headaches for
        # multi-line setup/test scripts).
        eval "$(python3 - "$CFG" <<'PY'
        import json, shlex, sys
        try:
            import yaml
        except ImportError:
            print('echo "::error::python3 yaml module missing; apt-get install python3-yaml on the runner"; exit 1')
            sys.exit(0)
        with open(sys.argv[1]) as f:
            d = yaml.safe_load(f) or {}
        def join_cmds(x):
            if not x: return ""
            if isinstance(x, str): return x
            if isinstance(x, list): return " && ".join(str(c) for c in x)
            return ""
        image      = d.get("image") or "ubuntu-24.04"
        setup      = join_cmds(d.get("setup"))
        test_cmd   = join_cmds(d.get("test"))
        serve      = d.get("serve") or {}
        serve_cmd  = serve.get("command", "") if isinstance(serve, dict) else ""
        serve_port = serve.get("port", "")    if isinstance(serve, dict) else ""
        for var, val in [
            ("IMAGE",      image),
            ("SETUP",      setup),
            ("TEST",       test_cmd),
            ("SERVE_CMD",  serve_cmd),
            ("SERVE_PORT", str(serve_port) if serve_port != "" else ""),
        ]:
            print(f"{var}={shlex.quote(str(val))}")
        PY
        )"
        {
          echo "image=$IMAGE"
          echo "setup<<EOF"; echo "$SETUP"; echo "EOF"
          echo "test<<EOF";  echo "$TEST";  echo "EOF"
          echo "serve-cmd=$SERVE_CMD"
          echo "serve-port=$SERVE_PORT"
        } >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 3a. Generate a throwaway SSH keypair for this CI run.
    #
    # `containarium create` REQUIRES --ssh-key (the CLI rejects calls
    # without one — "Error: required flag(s) "ssh-key" not set"). The
    # action can't carry a long-lived key, so we mint a fresh ed25519
    # pair per run, pass the pubkey at create time, and use the
    # privkey for the subsequent ssh / rsync / scp calls.
    #
    # Both files land under $RUNNER_TEMP (cleaned up by GHA at the
    # end of the job). The privkey is mode 0600 so ssh accepts it.
    # ------------------------------------------------------------------
    - name: Mint per-run SSH keypair
      shell: bash
      id: sshkey
      run: |
        set -euo pipefail
        KEY="${RUNNER_TEMP}/containarium-ci-key"
        ssh-keygen -t ed25519 -N "" -f "$KEY" -C "containarium-ci-${GITHUB_RUN_ID}" -q
        chmod 600 "$KEY"
        echo "priv=$KEY" >> "$GITHUB_OUTPUT"
        echo "pub=${KEY}.pub" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 3b. Create the box.
    # ------------------------------------------------------------------
    - name: Create Containarium box
      shell: bash
      id: create
      env:
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
      run: |
        set -euo pipefail
        BOX_NAME="ci-${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        # TODO: containarium create currently targets the local daemon.
        # The CLI needs `--api-url` + `--token` flags (or env-var honoring)
        # to talk to remote Cloud / self-hosted endpoints. Track at
        # FootprintAI/containarium#TODO.
        containarium create "$BOX_NAME" \
          --image "${{ steps.config.outputs.image }}" \
          --ssh-key "${{ steps.sshkey.outputs.pub }}"
        echo "box-id=$BOX_NAME" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 4. Push source code into the box.
    #
    # Uses the per-run privkey from step 3a directly, bypassing
    # `containarium ssh-config sync` (which is meant for ad-hoc
    # persistent users + a long-lived ~/.ssh/id_ed25519 — not a CI
    # one-shot). StrictHostKeyChecking=accept-new pins the host's
    # key on first connect; subsequent steps in the same job reuse
    # the same known_hosts entry.
    # ------------------------------------------------------------------
    - name: Push source to box
      shell: bash
      env:
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
      run: |
        set -euo pipefail
        BOX="${{ steps.create.outputs.box-id }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"
        # TODO: pick a stable workdir convention for CI runs (e.g. /workspace).
        # Confirm the box's default user has write access there, or chown on
        # first push.
        rsync -az --delete \
          -e "ssh -i $SSH_KEY -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
          ./ "$BOX:/workspace/"

    # ------------------------------------------------------------------
    # 5. Write CI context file into the box.
    #
    # Drops /workspace/.containarium/ci-context.json so the agent-box
    # MCP server can expose it as a resource. Without this, an agent
    # connecting to a failing box has zero context and wastes its first
    # turn asking "what am I looking at?" — see the companion change to
    # agent-box that surfaces this file as an MCP resource.
    #
    # On the create-time write we know everything except failing_test /
    # failure_log_tail; those fields are appended/overwritten by the
    # failure-handling step below if the test step fails.
    # ------------------------------------------------------------------
    - name: Write CI context to box
      shell: bash
      run: |
        set -euo pipefail
        BOX="${{ steps.create.outputs.box-id }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"

        # Pull PR-specific fields out of the event payload when this is a
        # pull_request event; on push events they stay null and jq omits
        # them via the `// empty` fallbacks below.
        PR_NUMBER=""
        PR_URL=""
        PR_TITLE=""
        BRANCH=""
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -f "${GITHUB_EVENT_PATH:-}" ]; then
          PR_NUMBER=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
          PR_URL=$(jq -r '.pull_request.html_url // empty' "$GITHUB_EVENT_PATH")
          PR_TITLE=$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH")
          BRANCH=$(jq -r '.pull_request.head.ref // empty' "$GITHUB_EVENT_PATH")
        else
          # push event: branch comes from GITHUB_REF_NAME, PR fields stay empty.
          BRANCH="${GITHUB_REF_NAME:-}"
        fi

        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        # Build JSON with jq so user-controlled values (PR title, branch
        # name, actor) can never break out of string context. Numeric
        # fields use --argjson with a `// null` fallback for the push-event
        # case where pr_number is empty.
        jq -n \
          --arg   repo         "$GITHUB_REPOSITORY" \
          --arg   pr_url       "$PR_URL" \
          --arg   pr_title     "$PR_TITLE" \
          --arg   commit_sha   "$GITHUB_SHA" \
          --arg   branch       "$BRANCH" \
          --arg   actor        "$GITHUB_ACTOR" \
          --arg   run_id       "$GITHUB_RUN_ID" \
          --arg   run_url      "$RUN_URL" \
          --argjson pr_number  "${PR_NUMBER:-null}" \
          --argjson run_attempt "${GITHUB_RUN_ATTEMPT:-1}" \
          '{
            schema_version: "1.0",
            platform: "github",
            repo: $repo,
            pr_number: $pr_number,
            pr_url: (if $pr_url == "" then null else $pr_url end),
            pr_title: (if $pr_title == "" then null else $pr_title end),
            commit_sha: $commit_sha,
            branch: (if $branch == "" then null else $branch end),
            actor: $actor,
            run_id: $run_id,
            run_url: $run_url,
            run_attempt: $run_attempt,
            workspace_path: "/workspace"
          }' \
          > /tmp/ci-context.json

        ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$BOX" -- "mkdir -p /workspace/.containarium"
        scp -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new /tmp/ci-context.json "$BOX:/workspace/.containarium/ci-context.json"

    # ------------------------------------------------------------------
    # 6. Run setup commands inside the box (the "warm cache" half).
    # ------------------------------------------------------------------
    - name: Run setup
      shell: bash
      if: steps.config.outputs.setup != ''
      run: |
        set -euo pipefail
        BOX="${{ steps.create.outputs.box-id }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"
        ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$BOX" -- \
          "cd /workspace && ${{ steps.config.outputs.setup }}"

    # ------------------------------------------------------------------
    # 7. Run the actual tests.
    #
    # Tee output to /tmp/test-output.log so the failure-handling step
    # can pull `failing_test` and `failure_log_tail` out of it for the
    # CI context file.
    # ------------------------------------------------------------------
    - name: Run test
      shell: bash
      id: test
      run: |
        set -euo pipefail
        BOX="${{ steps.create.outputs.box-id }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"
        # Pipe through tee but preserve the exit status of ssh via
        # PIPESTATUS so a test failure still fails this step.
        set -o pipefail
        ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$BOX" -- \
          "cd /workspace && ${{ steps.config.outputs.test }}" \
          2>&1 | tee /tmp/test-output.log
        exit "${PIPESTATUS[0]}"

    # ------------------------------------------------------------------
    # 8. If containarium.yml had a `serve:` block, expose it.
    #    (Used for PR-preview environments — irrelevant for plain CI.)
    # ------------------------------------------------------------------
    - name: 'Expose port (if serve block defined)'
      shell: bash
      id: expose
      if: steps.config.outputs.serve-port != ''
      env:
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
      run: |
        set -euo pipefail
        BOX="${{ steps.create.outputs.box-id }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"
        # Start the serve command in the background inside the box.
        ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$BOX" -- \
          "cd /workspace && nohup ${{ steps.config.outputs.serve-cmd }} >/tmp/serve.log 2>&1 &"
        # Expose the port — the CLI prints the public URL on success.
        URL=$(containarium expose-port "$BOX" --port "${{ steps.config.outputs.serve-port }}" --output url)
        echo "url=$URL" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 9. SUCCESS PATH — tear down the box.
    # ------------------------------------------------------------------
    - name: Tear down box (success)
      shell: bash
      if: success()
      env:
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
      run: |
        set -euo pipefail
        containarium delete "${{ steps.create.outputs.box-id }}" --yes

    # ------------------------------------------------------------------
    # 10. FAILURE PATH — keep box alive, refresh CI context with
    #     failing-test info, post debug PR comment.
    # ------------------------------------------------------------------
    - name: Keep box alive + post debug comment on failure
      shell: bash
      id: debug
      if: failure() && inputs.keep-on-failure == 'true' && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        CONTAINARIUM_HTTP:   'true'
        CONTAINARIUM_SERVER: ${{ inputs.server }}
        CONTAINARIUM_TOKEN:  ${{ inputs.token }}
      run: |
        set -euo pipefail
        BOX="${{ steps.create.outputs.box-id }}"
        SSH_KEY="${{ steps.sshkey.outputs.priv }}"

        # Refresh /workspace/.containarium/ci-context.json with what we
        # learned from the test run — failing_test name + tail of output.
        # Best-effort: if there's no test-output.log (e.g. setup itself
        # failed) we skip the refresh and the create-time context is what
        # the agent gets.
        if [ -f /tmp/test-output.log ]; then
          # Grab the last "FAIL:" / "--- FAIL:" / "FAIL " line and pull out
          # what looks like a test name. Covers `go test` (--- FAIL: TestX),
          # pytest (FAILED path::TestX), and generic "FAIL: name" output.
          # If nothing matches we leave failing_test null rather than
          # guessing — the agent can read failure_log_tail and figure it out.
          FAILING_TEST=$(grep -E '(^|[[:space:]])(---[[:space:]]+)?FAIL(ED)?[:[:space:]]' /tmp/test-output.log \
            | tail -n 1 \
            | sed -E 's/.*FAIL(ED)?:?[[:space:]]+([^[:space:]]+).*/\2/' \
            || true)
          FAILURE_LOG_TAIL=$(tail -n 50 /tmp/test-output.log)

          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$BOX" -- \
            "cat /workspace/.containarium/ci-context.json" > /tmp/ci-context.json.old || \
            echo '{}' > /tmp/ci-context.json.old

          jq \
            --arg failing_test     "$FAILING_TEST" \
            --arg failure_log_tail "$FAILURE_LOG_TAIL" \
            '. + {
              failing_test:     (if $failing_test     == "" then null else $failing_test     end),
              failure_log_tail: (if $failure_log_tail == "" then null else $failure_log_tail end)
            }' \
            /tmp/ci-context.json.old > /tmp/ci-context.json

          scp -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new /tmp/ci-context.json "$BOX:/workspace/.containarium/ci-context.json" || true
        fi

        # TODO: schedule auto-delete in 1h. Either via `containarium ttl set`
        # (new CLI verb needed) or via the Cloud API. Without this the box
        # leaks until manually deleted.
        # TODO: extract host suffix from --api-url instead of hardcoding the
        # cloud domain.
        SSH_CMD="ssh -p 2222 debug@${BOX}.boxes.containarium.dev"
        MCP_URL="ssh user@${BOX}.containarium.dev agent-box"
        echo "url=$MCP_URL" >> "$GITHUB_OUTPUT"
        # TODO: sticky-comment behavior — find existing containarium-bot
        # comment on this PR and edit it instead of posting a new one.
        #
        # Post via gh CLI when available, else fall back to GitHub's
        # REST API directly. Many self-hosted runners don't ship gh —
        # falling back to curl keeps debug-on-failure visibility working
        # on any runner with bash + curl + jq. (jq is already a hard
        # dep — earlier steps use it to build ci-context.json.)
        BODY=$(cat <<EOF
        ### ❌ CI failed — box kept alive for debugging

        **Debug this box live** (expires in 60 minutes)

        \`\`\`bash
        # SSH in
        ${SSH_CMD}

        # Or hand it to your agent (Claude Code, Cursor, ...)
        # The box's agent-box MCP server is reachable over SSH-stdio:
        ${MCP_URL}
        \`\`\`

        Posted by [containarium-run](https://github.com/FootprintAI/containarium-run) · commit \`${GITHUB_SHA:0:7}\`
        EOF
        )
        PR_NUM="${{ github.event.pull_request.number }}"
        if command -v gh >/dev/null 2>&1; then
          gh pr comment "$PR_NUM" --body "$BODY"
        else
          # GH_TOKEN env above carries github.token; same auth as gh.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" \
            -d "$(jq -nc --arg body "$BODY" '{body: $body}')" \
            >/dev/null
        fi
